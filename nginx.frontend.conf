map $http_user_agent $community_entry_uri {
    default /index.html;
    ~*(facebookexternalhit|facebot|twitterbot|slackbot|discordbot|kakaotalk|kakaostory|kakaocorp|telegrambot|linkedinbot|whatsapp|bot|crawler|spider) /api/community/posts/$community_post_id/share;
}

server {
    listen 80;
    server_name _;

    # Re-resolve the backend when Docker replaces its container or changes its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json text/css text/plain image/svg+xml;

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        # nginx here has no mime.types mapping for .webmanifest -> set it explicitly.
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~ ^/community/([0-9]+)$ {
        set $community_post_id $1;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $community_entry_uri;
    }

    location ~ ^/api/community/posts/[0-9]+/(share|share-data|share-image)$ {
        set $coms_backend coms-backend:8080;
        proxy_pass http://$coms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The host proxy sends non-/api paths here. Forward the two public Actuator
    # endpoints instead of letting the SPA fallback return HTML with status 200.
    location ~ ^/actuator/(health|info)$ {
        set $coms_backend coms-backend:8080;
        proxy_pass http://$coms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Android App Links verification. Must be served as JSON from the site root over the
    # SPA fallback, otherwise Google's verifier receives index.html and the link handler
    # is never granted. nginx here has no mime.types entry for this path -> set it.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # $uri.html: the public pages (/recruit, /apps, ...) have their own copy of index.html
        # with that page's title and link-preview tags (src/routes/publicPageMeta.ts).
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# Link-preview crawlers get the backend's Open Graph card instead of the SPA. The query string
# carries the share signature (?s=...) that decides whether the card may show the post itself.
map $http_user_agent $community_entry_uri {
    default /index.html;
    ~*(facebookexternalhit|facebot|twitterbot|slackbot|discordbot|kakaotalk|kakaostory|kakaocorp|telegrambot|linkedinbot|whatsapp|bot|crawler|spider) /api/community/posts/$community_post_id/share?$args;
}

# Circuit Lab compile API (/lab/api/compile below). This file is included inside http{}, so the zones
# can live here. Two layers:
#
# 1. Before login (limit_req runs ahead of auth_request, so this layer sees anonymous traffic and
#    bounds how many auth subrequests the backend gets): per client address, plus one shared bucket
#    as a high backstop. The address is $remote_addr after the realip module below has replaced the
#    Docker bridge gateway with X-Real-IP. That header can be believed because the host nginx
#    (/etc/nginx/conf.d/coms.conf, its catch-all location proxying to http://127.0.0.1:3000) contains
#        proxy_set_header X-Real-IP $remote_addr;
#    which OVERWRITES whatever the client sent, for everything that reaches this container, /lab/*
#    included. This rests on that host line: if it were removed, every visitor would share the
#    gateway address (30 a minute for everybody) -- the shared backstop and the member limit below
#    still hold, so it fails closed, not open.
# 2. After login: the compiler limits each member (RATE_LIMIT_PER_MIN, default 10) by the member id the
#    backend returned for the session (auth_request_set below), plus its own global queue.
#
# The shared bucket is set far above what the club's members can produce; it only trips under a
# flood, and anonymous traffic shares it with members, so a flood can make members' compiles 429
# until it stops. That is the price of keeping the backend's auth endpoint bounded.
map $host $lab_global {
    default lab;
}
limit_req_zone $binary_remote_addr zone=lab_pre_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=lab_pre_ip_conn:10m;
limit_req_zone $lab_global zone=lab_pre:64k rate=600r/m;
limit_conn_zone $lab_global zone=lab_pre_conn:64k;

# Study code runner (/study/api/run below): the same two layers as the Circuit Lab above, with its own
# zones so the two features never share a budget. Before login: per client address (a run is rarer than a
# page view, so 60 a minute is generous) plus a high shared backstop; after login the runner itself limits
# each member (RATE_LIMIT_PER_MIN, default 10) by the id the backend returned for the session.
map $host $study_global {
    default study;
}
limit_req_zone $binary_remote_addr zone=study_pre_ip:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=study_pre_ip_conn:10m;
limit_req_zone $study_global zone=study_pre:64k rate=600r/m;
limit_conn_zone $study_global zone=study_pre_conn:64k;

server {
    listen 80;
    server_name _;

    # Re-resolve the backend when Docker replaces its container or changes its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The host nginx reaches this container over the Docker bridge and sets X-Real-IP to the real
    # client address (see the comment on the Circuit Lab zones above). Believe it only from Docker's
    # default address pools (172.16.0.0/12 covers the bridge networks; the published port is bound to
    # 127.0.0.1, so the only peers are the host and the other services of this compose project).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json text/css text/plain image/svg+xml;

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        # nginx here has no mime.types mapping for .webmanifest -> set it explicitly.
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~ ^/community/([0-9]+)$ {
        set $community_post_id $1;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $community_entry_uri;
    }

    location ~ ^/api/community/posts/[0-9]+/(share|share-data|share-image)$ {
        set $coms_backend coms-backend:8080;
        proxy_pass http://$coms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The host proxy sends non-/api paths here. Forward the two public Actuator
    # endpoints instead of letting the SPA fallback return HTML with status 200.
    location ~ ^/actuator/(health|info)$ {
        set $coms_backend coms-backend:8080;
        proxy_pass http://$coms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Android App Links verification. Must be served as JSON from the site root over the
    # SPA fallback, otherwise Google's verifier receives index.html and the link handler
    # is never granted. nginx here has no mime.types entry for this path -> set it.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Runs the editable demos of /study. Deliberately NOT security-headers.conf: it must allow inline
    # scripts, which the site CSP forbids. `sandbox` in the CSP forces an opaque origin even when this
    # URL is opened top-level, so posted code never runs with the site's origin, cookies or storage.
    # add_header does not inherit here because the location declares its own.
    location = /study-sandbox.html {
        add_header Content-Security-Policy "sandbox allow-scripts allow-modals; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data: blob:; media-src https: data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files /study-sandbox.html =404;
    }

    # ---- Circuit Lab: the app built from lab/ lives under /lab/ in this image (Dockerfile.frontend) ----
    # Its own CSP (security-headers-lab.conf), not the SPA's. `^~` keeps the SPA's regex locations
    # (e.g. /community/<id>) from ever matching a /lab/ path.
    location = /lab {
        absolute_redirect off;  # the host proxy terminates TLS: a relative Location keeps https
        return 301 /lab/;
    }

    location = /lab/index.html {
        include /etc/nginx/security-headers-lab.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /lab/index.html =404;
    }

    # Hashed Vite output: a missing file is a 404, never the app shell.
    location ^~ /lab/assets/ {
        include /etc/nginx/security-headers-lab.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /lab/ {
        include /etc/nginx/security-headers-lab.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Deep links (/lab/anything) open the app; it reads its state from the URL hash.
        try_files $uri /lab/index.html;
    }

    # Everything under /lab/api/ that is not listed here does not exist.
    location ^~ /lab/api/ {
        include /etc/nginx/security-headers-common.conf;
        return 404;
    }

    # Compiles Arduino sketches in the sandboxed coms-lab-compiler container (network_mode none), reached
    # through a unix socket on a volume shared with this container. Members only: the session cookie is
    # checked against the backend first, and never forwarded to the compiler.
    location = /lab/api/compile {
        if ($request_method != POST) { return 405; }
        # One session cookie of sane size; anything else is not a browser of ours.
        if ($http_cookie ~ "^.{4097,}") { return 431; }
        if ($http_cookie ~ "(^|;\s*)token=[^;]*;(.*;)?\s*token=") { return 400; }

        limit_req zone=lab_pre_ip burst=15 nodelay;
        limit_req zone=lab_pre burst=200 nodelay;
        limit_req_status 429;
        limit_conn lab_pre_ip_conn 6;
        limit_conn lab_pre_conn 64;
        limit_conn_status 429;
        auth_request /lab/_auth;
        # The backend names the member it authenticated; whatever the client sent as X-Lab-Client is
        # replaced below, so the compiler's per-member limit keys on the backend's answer only.
        auth_request_set $lab_member $upstream_http_x_member_id;
        error_page 401 403 = @lab_unauthorized;
        error_page 429 = @lab_rate_limited;

        client_max_body_size 100k;
        client_body_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        # The host proxy sets no proxy_read_timeout (60 s). The compiler answers within ~46 s
        # (25 s at most waiting for a slot + the 20 s compile); stay under the host's limit so the
        # visitor gets the compiler's JSON, not the host's 504.
        proxy_read_timeout 55s;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Lab-Client $lab_member;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://unix:/run/coms-lab/compile.sock:/lab/api/compile;
    }

    # Liveness of the compiler process only (not of Arduino itself). 502 when the compiler is down.
    location = /lab/api/health {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Lab-Client "";
        proxy_set_header X-Forwarded-For "";
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://unix:/run/coms-lab/compile.sock:/lab/api/health;
    }

    # Is this visitor a signed-in member? The backend answers 200 for a valid session, 401 otherwise.
    location = /lab/_auth {
        internal;
        set $coms_backend coms-backend:8080;
        proxy_pass http://$coms_backend/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        # A same-site page's Origin/Referer are meaningless to this subrequest, and the backend's CORS check
        # answers 403 for an origin it does not list (a staging host, the CI stack) -> a false 401.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # The Lab shows errors[].message to the user.
    location @lab_unauthorized {
        default_type application/json;
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        return 401 '{"ok":false,"errors":[{"line":0,"severity":"error","message":"로그인한 동아리원만 컴파일할 수 있어요."}]}';
    }

    location @lab_rate_limited {
        default_type application/json;
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 429 '{"ok":false,"reason":"rate-limited","errors":[{"line":0,"severity":"error","message":"요청이 너무 많아요. 잠시 후 다시 시도해 주세요."}]}';
    }

    # ---- Study code runner: the "직접 해보기" playground of /study/c, /study/java, /study/python ----
    # Runs members' C / Java / Python programs in the sandboxed coms-study-runner container (network_mode
    # none), reached through a unix socket on a volume shared with this container. Members only: the
    # session cookie is checked against the backend first and never forwarded to the runner. API contract:
    # docs/study-runner-api.md. The runner's health endpoint is for its own container healthcheck and is
    # deliberately not reachable from here.

    # Everything under /study/api/ that is not listed here does not exist (JSON, not the SPA shell).
    location ^~ /study/api/ {
        include /etc/nginx/security-headers-common.conf;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"rejected","messageKo":"요청한 경로를 찾을 수 없어요."}';
    }

    location = /study/api/run {
        if ($request_method != POST) { return 405; }
        # One session cookie of sane size; anything else is not a browser of ours.
        if ($http_cookie ~ "^.{4097,}") { return 431; }
        if ($http_cookie ~ "(^|;\s*)token=[^;]*;(.*;)?\s*token=") { return 400; }

        limit_req zone=study_pre_ip burst=20 nodelay;
        limit_req zone=study_pre burst=200 nodelay;
        limit_req_status 429;
        limit_conn study_pre_ip_conn 6;
        limit_conn study_pre_conn 64;
        limit_conn_status 429;
        auth_request /lab/_auth;
        # The backend names the member it authenticated; whatever the client sent as X-Runner-Client is
        # replaced below, so the runner's per-member limit and deny-list key on the backend's answer only.
        auth_request_set $runner_client $upstream_http_x_member_id;
        error_page 401 403 = @study_unauthorized;
        error_page 429 = @study_rate_limited;

        client_max_body_size 100k;
        client_body_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        # The host proxy sets no proxy_read_timeout (60 s). The runner ends every request within ~55 s
        # (25 s queue + 15 s compile + 10 s run + cleanup; its server.timeout is 58 s): stay under the host's
        # limit so the visitor gets the runner's JSON, not the host's 504.
        proxy_read_timeout 58s;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Runner-Client $runner_client;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://unix:/run/coms-study/run.sock:/study/api/run;
    }

    location @study_unauthorized {
        default_type application/json;
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"unauthorized","messageKo":"로그인한 동아리원만 코드를 실행할 수 있어요."}';
    }

    location @study_rate_limited {
        default_type application/json;
        include /etc/nginx/security-headers-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate-limited","messageKo":"요청이 너무 많아요. 잠시 후 다시 시도해 주세요."}';
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # $uri.html: the public pages (/recruit, /apps, ...) have their own copy of index.html
        # with that page's title and link-preview tags (src/routes/publicPageMeta.ts).
        try_files $uri $uri.html $uri/ /index.html;
    }
}

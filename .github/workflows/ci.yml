name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request replaces the run before it. Pushes to main are never
# cancelled: the deploy workflow waits for this workflow to finish on each of them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned to ubuntu-24.04 in every workflow: the ubuntu-latest label starts moving
# to Ubuntu 26 on 2026-10-19, and the image should change when we choose to, not mid-release.
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The suite itself still runs on H2; this container exists so the Postgres tests can
    # replay every Flyway migration against the database engine production actually uses
    # (PostgresMigrationExecutionTest) and boot the application on that schema with the prod
    # profile and ddl-auto=validate (PostgresProductionSchemaTest).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: coms-ci
          POSTGRES_DB: coms_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Gradle toolchain pins Java 21 (Spring Boot 4 / Gradle 9.x); 17 will not compile.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run backend tests
        working-directory: backend
        env:
          COMS_PG_TEST_URL: jdbc:postgresql://localhost:5432/coms_migration_test
          COMS_PG_TEST_USER: postgres
          COMS_PG_TEST_PASSWORD: coms-ci
        run: JWT_SECRET="$(openssl rand -base64 48)" ./gradlew test --no-daemon

      # The Postgres tests skip themselves when COMS_PG_TEST_URL is missing, which would make
      # a broken service container look like a green build. Fail loudly instead.
      - name: Verify the Postgres tests were not skipped
        working-directory: backend
        run: |
          set -euo pipefail
          for test in PostgresMigrationExecutionTest PostgresProductionSchemaTest; do
            report="build/test-results/test/TEST-com.coms.backend.config.${test}.xml"
            if [ ! -f "$report" ] || ! grep -q 'skipped="0"' "$report"; then
              echo "::error::${test} did not run — check the postgres service and COMS_PG_TEST_URL."
              [ -f "$report" ] && cat "$report"
              exit 1
            fi
          done

  frontend:
    name: Frontend tests, build & smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build output contract (backdrop-filter)
        run: REQUIRE_DIST=1 node --import tsx tests/backdropFilterBuild.test.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run smoke

      # Reuses the PWA-disabled build produced by `npm run smoke`.
      # mobile-visual is excluded: its screenshot baselines are darwin-only.
      - name: Accessibility e2e
        run: npx playwright test --project=accessibility

      - name: Study exercise browser suite and shipped web answers
        run: |
          STUDY_EXERCISE_FIXTURES=1 PWA_DISABLE=1 npm run build -- --configLoader runner
          STUDY_EXERCISE_FIXTURES=1 npx playwright test --project=smoke tests/e2e/study-exercises.spec.js tests/e2e/study-exercises-web-answers.spec.js

  # Circuit Lab (lab/) is its own app with its own lockfile; the root jobs do not look at it. The
  # Arduino compiler service runs here without the toolchain; the full compile path is exercised by
  # the stack job below, through the real images.
  lab:
    name: Circuit Lab tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Install dependencies
        working-directory: lab
        run: npm ci

      - name: Type check
        working-directory: lab
        run: npm run typecheck

      - name: Unit tests
        working-directory: lab
        run: npm test

      # Run wall-clock assertions separately, with file parallelism disabled.
      - name: Realtime acceptance
        working-directory: lab
        run: npm run test:realtime

      - name: Simulator core tests
        working-directory: lab
        run: npx vitest run src/core

      - name: Compiler service tests
        working-directory: lab
        run: node --test "compiler/test/*.test.mjs"

      # The sidecar steps of the deploy (snapshot / start / restore / prune) for the compiler and the study
      # runner, read in the order deploy.yml calls them, over several releases with a stand-in image.
      - name: Deploy script for the optional services
        run: scripts/test-deploy-sidecars.sh

  # The study code runner (runner/) runs members' C / Java / Python programs. Its unit and HTTP tests, then the
  # same container the compose file builds: the real compilers and the attack scenarios (privilege escalation,
  # fork/memory/IPC bombs, cleanup, seccomp) run inside it with the production flags, and the compose-level
  # checks (restart policy, deny-list, member key) start it the way the deploy does. Throw-away volume names.
  runner:
    name: Study code runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Unit, HTTP and compose-contract tests
        run: node --test "runner/test/*.test.mjs"

      - name: Build the runner image
        working-directory: runner
        env:
          NGINX_GID: "101"
          RUNNER_SOCKET_VOLUME: ci-socket
          RUNNER_STATE_VOLUME: ci-state
        run: docker compose -p studyrt -f docker-compose.yml build

      - name: Toolchains and attack scenarios in the production container
        working-directory: runner
        env:
          NGINX_GID: "101"
          RUNNER_SOCKET_VOLUME: ci-socket
          RUNNER_STATE_VOLUME: ci-state
        run: |
          docker compose -p studyrt -f docker-compose.yml run --rm --no-deps \
            -e RUNNER_TOOLCHAIN_TESTS=1 -e RUNNER_CONTAINER_ATTACK_TESTS=1 -e RUNNER_EXPECT_IPC_LIMITS=1 \
            runner node test/toolchain.mjs
          docker compose -p studyrt -f docker-compose.yml down -v

      - name: Verify exercise solutions against the real runner
        working-directory: runner
        env:
          NGINX_GID: "101"
          RUNNER_SOCKET_VOLUME: ci-socket
          RUNNER_STATE_VOLUME: ci-state
          RATE_LIMIT_PER_MIN: "1000"
        run: |
          set -euo pipefail
          docker compose -p studyrt -f docker-compose.yml up -d runner
          trap 'docker compose -p studyrt -f docker-compose.yml down -v' EXIT
          for attempt in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' studyrt-runner-1)" = healthy ] && break
            if [ "$attempt" -eq 60 ]; then docker logs --tail=50 studyrt-runner-1; exit 1; fi
            sleep 1
          done
          docker compose -p studyrt -f docker-compose.yml run --rm --no-deps \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo runner \
            node --experimental-strip-types scripts/verify-exercises.mjs --runner unix:/run/coms-study/run.sock

      - name: Compose end to end (seccomp, member key, restart after a crash, deny-list)
        working-directory: runner
        run: node test/compose-e2e.mjs

  # The deploy builds both images on the server and starts them with this same compose file,
  # and nothing before it ever built them. Do it here first, on a throwaway database, so a
  # Dockerfile, entrypoint, nginx or prod-profile start-up problem fails the pull request
  # instead of the deploy.
  stack:
    name: Production images build & boot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write a throwaway .env
        run: |
          umask 077
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            # Lets the Circuit Lab check below create the first admin (and so a login to compile with).
            echo "BOOTSTRAP_SECRET=$(openssl rand -hex 24)"
          } > .env
          # The deploy creates the backup directory as the deploy user before starting the stack.
          mkdir -p ../coms-backups
          chmod 700 ../coms-backups

      - name: Build and start the stack the way the deploy does
        run: docker compose --env-file .env -f docker-compose.yml up -d --build --remove-orphans

      - name: Wait for the backend, then check the site through nginx
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::The backend image did not come up on PostgreSQL with the prod profile."
              exit 1
            fi
            sleep 3
          done
          curl -fsS -o /dev/null -w 'backend /api/server/time: %{http_code}\n' http://127.0.0.1:8080/api/server/time
          curl -fsS -o /dev/null -w 'site /: %{http_code}\n' http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/actuator/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

      # coms-frontend serves /lab/ and sends /lab/api/compile to coms-lab-compiler over a unix socket,
      # after asking the backend whether the visitor is signed in. Everything here goes through the
      # frontend container, the way the host nginx reaches it in production.
      # Both sidecar checks below (Circuit Lab, study runner) need a signed-in member. The database is empty,
      # so the first admin is bootstrapped; its cookies and password stay in the runner's temp dir, never in the log.
      - name: Sign in as a fresh admin
        run: |
          set -euo pipefail
          umask 077
          secret="$(grep '^BOOTSTRAP_SECRET=' .env | cut -d= -f2-)"
          password="$(openssl rand -hex 16)Aa1!"
          origin='Origin: https://coms.kw.ac.kr'
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/api/maintenance/bootstrap \
            -H "$origin" -H "X-Bootstrap-Secret: $secret" -H 'Content-Type: application/json' \
            --data "{\"studentId\":\"2026000001\",\"name\":\"CI Admin\",\"email\":\"ci-admin@example.com\",\"password\":\"$password\"}"
          curl -fsS -D - -o /dev/null -X POST http://127.0.0.1:8080/api/auth/login \
            -H "$origin" -H 'Content-Type: application/json' \
            --data "{\"identifier\":\"2026000001\",\"password\":\"$password\",\"rememberMe\":false}" \
            | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\);.*/\1/p' | paste -sd ';' - | sed 's/;/; /g' > "$RUNNER_TEMP/member-cookies"
          printf '%s' "$password" > "$RUNNER_TEMP/admin-password"
          [ -s "$RUNNER_TEMP/member-cookies" ]

      - name: Circuit Lab through the frontend container
        run: |
          set -euo pipefail
          site=http://127.0.0.1:3000
          origin='Origin: https://coms.kw.ac.kr'
          sketch='{"sketch":"void setup() { pinMode(13, OUTPUT); }\nvoid loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }"}'

          for attempt in $(seq 1 30); do
            curl -fsS "$site/lab/api/health" > /dev/null 2>&1 && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::coms-lab-compiler did not answer through coms-frontend (unix socket / group access)."
              exit 1
            fi
            sleep 2
          done

          # The app, its CSP, a deep link and cache headers.
          curl -fsS -D - -o /dev/null "$site/lab/" | tr -d '\r' | grep -i "^content-security-policy: .*worker-src 'self' blob:"
          curl -fsS "$site/lab/some/deep/link" | grep -q "Circuit Lab"
          curl -fsS -D - -o /dev/null "$site$(curl -fsS "$site/lab/" | grep -o '/lab/assets/[^"]*\.js' | head -n 1)" | tr -d '\r' | grep -qi "^cache-control: .*immutable"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/lab/api/unknown")" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/lab/api/compile")" = 405 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Cookie: $(cat "$RUNNER_TEMP/member-cookies")" -H 'Sec-Fetch-Site: cross-site' -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")" = 403 ]

          # Not signed in: 401 JSON with the Korean message, and the compiler is never reached.
          body="$(curl -s -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")"
          [ "$(tail -n 1 <<< "$body")" = 401 ]
          grep -q '로그인한 동아리원만' <<< "$body"

          # The session made by the "Sign in" step above (never printed).
          cookies="$(cat "$RUNNER_TEMP/member-cookies")"
          [ -n "$cookies" ]

          # Signed in: Blink compiles to a hex through the socket.
          result="$(curl -fsS -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")"
          grep -q '"ok":true' <<< "$result"
          grep -q '"hex":":' <<< "$result"
          echo "Blink compiled through /lab/api/compile"

          # The compiler runs under the pinned seccomp profile (lab/compiler/seccomp.json), not the engine default.
          [ "$(docker exec coms-lab-compiler awk '/^Seccomp:/ {print $2}' /proc/1/status)" = 2 ]
          docker inspect coms-lab-compiler --format '{{json .HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges'

          # Forged session cookies are refused by the login check and cost the member nothing: the
          # per-member budget (10 a minute, kept by the compiler under the id the backend returned)
          # is untouched by them, a client-sent X-Lab-Client changes nothing, and the 11th real
          # compile of this minute is 429. Clients are told apart by X-Real-IP, which the host nginx
          # overwrites in production (here the request comes from the Docker bridge, so it is believed).
          for i in $(seq 1 15); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Real-IP: 203.0.113.$((100 + i))" -H "Cookie: token=forged.part$i.signature$i" -H 'X-Lab-Client: 2026000001' -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")" = 401 ]
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Real-IP: 203.0.113.150' -H "Cookie: token=a=1; token=b" -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")" = 400 ]
          for i in $(seq 2 10); do
            curl -fsS -o /dev/null -X POST -H 'X-Real-IP: 203.0.113.200' -H "Cookie: $cookies" -H 'X-Lab-Client: someone-else' -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile"
          done
          limited="$(curl -s -w '\n%{http_code}' -X POST -H 'X-Real-IP: 203.0.113.200' -H "Cookie: $cookies" -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")"
          [ "$(tail -n 1 <<< "$limited")" = 429 ]
          grep -q '"reason":"rate-limited"' <<< "$limited"

          # Before login the limit is per client address: one address runs out, another does not.
          codes=""
          for i in $(seq 1 25); do
            codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Real-IP: 203.0.113.99' -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")"
          done
          grep -q 429 <<< "$codes"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Real-IP: 203.0.113.98' -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")" = 401 ]

          # The compiler is optional for the site: down means 502 for the Lab, nothing else.
          docker stop coms-lab-compiler > /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")" = 502 ]
          curl -fsS -o /dev/null "$site/"
          curl -fsS "$site/actuator/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

      # coms-frontend serves the playground's API: /study/api/run goes to coms-study-runner over a unix socket
      # after the backend vouched for the session. A C, a Java and a Python program run in the real sandbox.
      - name: Study code runner through the frontend container
        run: |
          set -euo pipefail
          site=http://127.0.0.1:3000
          cookies="$(cat "$RUNNER_TEMP/member-cookies")"
          for attempt in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' coms-study-runner)" = healthy ] && break
            if [ "$attempt" -eq 45 ]; then echo "::error::coms-study-runner never became healthy."; docker logs --tail=50 coms-study-runner || true; exit 1; fi
            sleep 2
          done
          # post <json> -> the body, then the status on the last line; status_of / body_of split them again.
          post() { curl -s -w '\n%{http_code}' -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data "$1" "$site/study/api/run"; }
          status_of() { tail -n 1 <<< "$1"; }
          body_of() { sed '$d' <<< "$1"; }

          # Not signed in, forged or duplicated session cookies, wrong method or path: JSON refusals from nginx.
          body="$(curl -s -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"lang":"c","code":"int main(){}"}' "$site/study/api/run")"
          [ "$(tail -n 1 <<< "$body")" = 401 ]
          jq -e '.error == "unauthorized" and (.messageKo | length > 0)' <<< "$(sed '$d' <<< "$body")" > /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Cookie: token=forged.part.signature' -H 'X-Runner-Client: 2026000001' -H 'Content-Type: application/json' --data '{"lang":"c","code":"int main(){}"}' "$site/study/api/run")" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Cookie: token=a=1; token=b' -H 'Content-Type: application/json' --data '{}' "$site/study/api/run")" = 400 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/study/api/run")" = 405 ]
          # A request the browser labels cross-site never reaches the login check or the runner (valid session or not).
          body="$(curl -s -w '\n%{http_code}' -X POST -H "Cookie: $cookies" -H 'Sec-Fetch-Site: cross-site' -H 'Content-Type: application/json' --data '{"lang":"python","code":"print(1)"}' "$site/study/api/run")"
          [ "$(tail -n 1 <<< "$body")" = 403 ]
          jq -e '.error == "rejected"' <<< "$(sed '$d' <<< "$body")" > /dev/null
          for path in health nothing-here; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/study/api/$path")" = 404 ]
          done
          curl -s -D - -o /dev/null "$site/study/api/health" | tr -d '\r' | grep -qi '^x-content-type-options: nosniff'

          # The three languages, each with the output the program must print.
          out="$(post '{"lang":"c","code":"#include <stdio.h>\nint main(void) { printf(\"c-%d\\n\", 6 * 7); return 0; }"}')"
          [ "$(status_of "$out")" = 200 ]; jq -e '.ok == true and .stdout == "c-42\n" and .exitCode == 0' <<< "$(body_of "$out")" > /dev/null
          out="$(post '{"lang":"java","code":"import java.util.Scanner;\npublic class Main { public static void main(String[] a) { Scanner s = new Scanner(System.in); System.out.println(\"java-\" + s.nextLine()); } }","stdin":"ok\n"}')"
          [ "$(status_of "$out")" = 200 ]; jq -e '.ok == true and .stdout == "java-ok\n"' <<< "$(body_of "$out")" > /dev/null
          out="$(post '{"lang":"python","code":"print(\"py-\" + input())","stdin":"ok"}')"
          [ "$(status_of "$out")" = 200 ]; jq -e '.ok == true and .stdout == "py-ok\n"' <<< "$(body_of "$out")" > /dev/null
          # A compile error is a normal answer, with diagnostics (1-based line and column) and a Korean hint.
          out="$(post '{"lang":"c","code":"#include <stdio.h>\nint main(void) {\n    printf(\"x\\n\")\n    return 0;\n}\n"}')"
          [ "$(status_of "$out")" = 200 ]; jq -e '.ok == false and .stage == "compile" and .diagnostics[0].line == 3 and .diagnostics[0].column >= 1 and (.diagnostics[0].hintKo | length > 0)' <<< "$(body_of "$out")" > /dev/null
          out="$(post '{"lang":"python","code":"print(1 / 0)"}')"
          [ "$(status_of "$out")" = 200 ]; jq -e '.ok == true and .exitCode != 0 and (.stderr | contains("ZeroDivisionError"))' <<< "$(body_of "$out")" > /dev/null
          echo "C, Java and Python ran through /study/api/run"

          # The container is the hardened one: pinned seccomp profile, no network, read-only root.
          [ "$(docker exec coms-study-runner awk '/^Seccomp:/ {print $2}' /proc/1/status)" = 2 ]
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}} {{.HostConfig.ReadonlyRootfs}}' coms-study-runner)" = "none true" ]
          docker inspect -f 'CapAdd={{json .HostConfig.CapAdd}} CapDrop={{json .HostConfig.CapDrop}}' coms-study-runner
          # Exactly the four capabilities the server needs (it is container-root; every job drops to uid 10100).
          [ "$(docker inspect -f '{{range .HostConfig.CapAdd}}{{.}} {{end}}' coms-study-runner | tr ' ' '\n' | sed 's/^CAP_//' | grep . | sort | paste -sd, -)" = "KILL,SETGID,SETUID,SYS_RESOURCE" ]
          [ "$(docker inspect -f '{{range .HostConfig.CapDrop}}{{.}} {{end}}' coms-study-runner | sed 's/CAP_//g; s/ *$//')" = "ALL" ]

          # The runner's per-member limit (10 a minute) is the answer, in the contract's shape, once it is used up.
          limited=""
          for i in $(seq 1 14); do
            limited="$(curl -s -D - -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data '{"lang":"python","code":"print(1)"}' "$site/study/api/run" | tr -d '\r')"
            grep -q '^HTTP/1.1 429' <<< "$limited" && break
          done
          grep -q '^HTTP/1.1 429' <<< "$limited"
          grep -qi '^retry-after: ' <<< "$limited"
          grep -q '"error":"rate-limited"' <<< "$limited"

          # Before login the limit is per client address (X-Real-IP, which the host nginx overwrites).
          codes=""
          for i in $(seq 1 90); do
            codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Real-IP: 203.0.113.77' -H 'Content-Type: application/json' --data '{}' "$site/study/api/run")"
          done
          grep -q 429 <<< "$codes"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Real-IP: 203.0.113.78' -H 'Content-Type: application/json' --data '{}' "$site/study/api/run")" = 401 ]

      - name: Set up Node.js for the stack e2e
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies for the stack e2e
        run: npm ci

      - name: Install Playwright browser for the stack e2e
        run: npx playwright install --with-deps chromium

      # "직접 해보기" in a real browser against the real frontend container, backend and runner (nothing mocked).
      # The runner allows a member ten runs a minute and the step above used them up: start a fresh minute.
      - name: Study playground on the real stack
        env:
          E2E_STACK: "1"
          E2E_STACK_URL: http://127.0.0.1:3000
          E2E_STACK_BACKEND: http://127.0.0.1:8080
          E2E_STACK_ADMIN_ID: "2026000001"
        run: |
          sleep 62
          E2E_STACK_ADMIN_PASSWORD="$(cat "$RUNNER_TEMP/admin-password")" npx playwright test --project=stack

      # The runner is optional for the site: down means 502 for the playground and nothing else.
      - name: The site survives a stopped study runner
        run: |
          set -euo pipefail
          site=http://127.0.0.1:3000
          cookies="$(cat "$RUNNER_TEMP/member-cookies")"
          sleep 62
          docker stop coms-study-runner > /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data '{"lang":"python","code":"print(1)"}' "$site/study/api/run")" = 502 ]
          curl -fsS -o /dev/null "$site/study/c"
          curl -fsS -o /dev/null "$site/lab/"
          curl -fsS "$site/actuator/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

      - name: Check that the image applied every migration
        run: |
          set -euo pipefail
          expected="$(ls backend/src/main/resources/db/migration | sed -nE 's/^V([0-9]+)__.*\.sql$/\1/p' | sort -n | tail -n 1)"
          applied="$(docker compose --env-file .env -f docker-compose.yml exec -T db sh -c \
            'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select max(version::int) from flyway_schema_history where success"')"
          echo "newest migration file: V$expected, newest applied: V$applied"
          [ "$expected" = "$applied" ]

      - name: Check that backups are written and can be restored
        run: |
          set -euo pipefail
          compose="docker compose --env-file .env -f docker-compose.yml"
          # The db-backup service dumps once at start-up, then daily.
          for attempt in $(seq 1 30); do
            daily="$(ls -1 ../coms-backups/daily-*.dump 2>/dev/null | head -n 1 || true)"
            [ -n "$daily" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::The db-backup service did not write a dump."
              $compose logs db-backup || true
              exit 1
            fi
            sleep 2
          done
          [ -O "$daily" ] || { echo "::error::$daily is not owned by the backup directory's owner."; exit 1; }
          # The first daily dump can predate the backend's migrations, so only check that it is
          # a readable archive. (Listings are captured first: `| grep -q` can SIGPIPE pg_restore.)
          $compose exec -T db pg_restore --list < "$daily" > /dev/null
          echo "daily dump OK: $(basename "$daily")"
          # The same pre-deploy dump command the deploy workflow runs, taken after the migrations.
          $compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' > ../coms-backups/predeploy-ci.dump
          listing="$($compose exec -T db pg_restore --list < ../coms-backups/predeploy-ci.dump)"
          grep -q 'TABLE public members' <<< "$listing"
          echo "pre-deploy dump OK"

      # This database was created a minute ago and holds nothing, so its output can be shown.
      # The deploy workflow must not do the same with the production containers.
      - name: Show container state and output on failure
        if: failure()
        run: |
          docker compose --env-file .env -f docker-compose.yml ps || true
          docker logs --tail=300 coms-backend || true
          docker logs --tail=100 coms-frontend || true
          docker logs --tail=100 coms-lab-compiler || true
          docker logs --tail=100 coms-study-runner || true

  backend-e2e:
    name: Real-backend auth e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Backend-auth e2e
        run: npm run test:e2e:backend

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request replaces the run before it. Pushes to main are never
# cancelled: the deploy workflow waits for this workflow to finish on each of them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned to ubuntu-24.04 in every workflow: the ubuntu-latest label starts moving
# to Ubuntu 26 on 2026-10-19, and the image should change when we choose to, not mid-release.
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The suite itself still runs on H2; this container exists so the Postgres tests can
    # replay every Flyway migration against the database engine production actually uses
    # (PostgresMigrationExecutionTest) and boot the application on that schema with the prod
    # profile and ddl-auto=validate (PostgresProductionSchemaTest).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: coms-ci
          POSTGRES_DB: coms_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Gradle toolchain pins Java 21 (Spring Boot 4 / Gradle 9.x); 17 will not compile.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run backend tests
        working-directory: backend
        env:
          COMS_PG_TEST_URL: jdbc:postgresql://localhost:5432/coms_migration_test
          COMS_PG_TEST_USER: postgres
          COMS_PG_TEST_PASSWORD: coms-ci
        run: JWT_SECRET="$(openssl rand -base64 48)" ./gradlew test --no-daemon

      # The Postgres tests skip themselves when COMS_PG_TEST_URL is missing, which would make
      # a broken service container look like a green build. Fail loudly instead.
      - name: Verify the Postgres tests were not skipped
        working-directory: backend
        run: |
          set -euo pipefail
          for test in PostgresMigrationExecutionTest PostgresProductionSchemaTest; do
            report="build/test-results/test/TEST-com.coms.backend.config.${test}.xml"
            if [ ! -f "$report" ] || ! grep -q 'skipped="0"' "$report"; then
              echo "::error::${test} did not run — check the postgres service and COMS_PG_TEST_URL."
              [ -f "$report" ] && cat "$report"
              exit 1
            fi
          done

  frontend:
    name: Frontend tests, build & smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build output contract (backdrop-filter)
        run: REQUIRE_DIST=1 node --import tsx tests/backdropFilterBuild.test.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run smoke

      # Reuses the PWA-disabled build produced by `npm run smoke`.
      # mobile-visual is excluded: its screenshot baselines are darwin-only.
      - name: Accessibility e2e
        run: npx playwright test --project=accessibility

  # Circuit Lab (lab/) is its own app with its own lockfile; the root jobs do not look at it. The
  # Arduino compiler service runs here without the toolchain; the full compile path is exercised by
  # the stack job below, through the real images.
  lab:
    name: Circuit Lab tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Install dependencies
        working-directory: lab
        run: npm ci

      - name: Type check
        working-directory: lab
        run: npm run typecheck

      - name: Unit tests
        working-directory: lab
        run: npm test

      # Already part of the run above; kept as its own step so a simulator-core failure is named in the log.
      - name: Simulator core tests
        working-directory: lab
        run: npx vitest run src/core

      - name: Compiler service tests
        working-directory: lab
        run: node --test compiler/test

  # The deploy builds both images on the server and starts them with this same compose file,
  # and nothing before it ever built them. Do it here first, on a throwaway database, so a
  # Dockerfile, entrypoint, nginx or prod-profile start-up problem fails the pull request
  # instead of the deploy.
  stack:
    name: Production images build & boot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write a throwaway .env
        run: |
          umask 077
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            # Lets the Circuit Lab check below create the first admin (and so a login to compile with).
            echo "BOOTSTRAP_SECRET=$(openssl rand -hex 24)"
          } > .env
          # The deploy creates the backup directory as the deploy user before starting the stack.
          mkdir -p ../coms-backups
          chmod 700 ../coms-backups

      - name: Build and start the stack the way the deploy does
        run: docker compose --env-file .env -f docker-compose.yml up -d --build --remove-orphans

      - name: Wait for the backend, then check the site through nginx
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::The backend image did not come up on PostgreSQL with the prod profile."
              exit 1
            fi
            sleep 3
          done
          curl -fsS -o /dev/null -w 'backend /api/server/time: %{http_code}\n' http://127.0.0.1:8080/api/server/time
          curl -fsS -o /dev/null -w 'site /: %{http_code}\n' http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/actuator/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

      # coms-frontend serves /lab/ and sends /lab/api/compile to coms-lab-compiler over a unix socket,
      # after asking the backend whether the visitor is signed in. Everything here goes through the
      # frontend container, the way the host nginx reaches it in production.
      - name: Circuit Lab through the frontend container
        run: |
          set -euo pipefail
          site=http://127.0.0.1:3000
          origin='Origin: https://coms.kw.ac.kr'
          sketch='{"sketch":"void setup() { pinMode(13, OUTPUT); }\nvoid loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }"}'

          for attempt in $(seq 1 30); do
            curl -fsS "$site/lab/api/health" > /dev/null 2>&1 && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::coms-lab-compiler did not answer through coms-frontend (unix socket / group access)."
              exit 1
            fi
            sleep 2
          done

          # The app, its CSP, a deep link and cache headers.
          curl -fsS -D - -o /dev/null "$site/lab/" | tr -d '\r' | grep -i "^content-security-policy: .*worker-src 'self' blob:"
          curl -fsS "$site/lab/some/deep/link" | grep -q "Circuit Lab"
          curl -fsS -D - -o /dev/null "$site$(curl -fsS "$site/lab/" | grep -o '/lab/assets/[^"]*\.js' | head -n 1)" | tr -d '\r' | grep -qi "^cache-control: .*immutable"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/lab/api/unknown")" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/lab/api/compile")" = 405 ]

          # Not signed in: 401 JSON with the Korean message, and the compiler is never reached.
          body="$(curl -s -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")"
          [ "$(tail -n 1 <<< "$body")" = 401 ]
          grep -q '로그인한 동아리원만' <<< "$body"

          # Sign in as a fresh admin (the throwaway database is empty). The cookies are used below
          # but never printed.
          secret="$(grep '^BOOTSTRAP_SECRET=' .env | cut -d= -f2-)"
          password="$(openssl rand -hex 16)Aa1!"
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/api/maintenance/bootstrap \
            -H "$origin" -H "X-Bootstrap-Secret: $secret" -H 'Content-Type: application/json' \
            --data "{\"studentId\":\"2026000001\",\"name\":\"CI Admin\",\"email\":\"ci-admin@example.com\",\"password\":\"$password\"}"
          cookies="$(curl -fsS -D - -o /dev/null -X POST http://127.0.0.1:8080/api/auth/login \
            -H "$origin" -H 'Content-Type: application/json' \
            --data "{\"identifier\":\"2026000001\",\"password\":\"$password\",\"rememberMe\":false}" \
            | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\);.*/\1/p' | paste -sd ';' - | sed 's/;/; /g')"
          [ -n "$cookies" ]

          # Signed in: Blink compiles to a hex through the socket.
          result="$(curl -fsS -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")"
          grep -q '"ok":true' <<< "$result"
          grep -q '"hex":":' <<< "$result"
          echo "Blink compiled through /lab/api/compile"

          # The compiler is optional for the site: down means 502 for the Lab, nothing else.
          docker stop coms-lab-compiler > /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Cookie: $cookies" -H 'Content-Type: application/json' --data "$sketch" "$site/lab/api/compile")" = 502 ]
          curl -fsS -o /dev/null "$site/"
          curl -fsS "$site/actuator/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

      - name: Check that the image applied every migration
        run: |
          set -euo pipefail
          expected="$(ls backend/src/main/resources/db/migration | sed -nE 's/^V([0-9]+)__.*\.sql$/\1/p' | sort -n | tail -n 1)"
          applied="$(docker compose --env-file .env -f docker-compose.yml exec -T db sh -c \
            'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select max(version::int) from flyway_schema_history where success"')"
          echo "newest migration file: V$expected, newest applied: V$applied"
          [ "$expected" = "$applied" ]

      - name: Check that backups are written and can be restored
        run: |
          set -euo pipefail
          compose="docker compose --env-file .env -f docker-compose.yml"
          # The db-backup service dumps once at start-up, then daily.
          for attempt in $(seq 1 30); do
            daily="$(ls -1 ../coms-backups/daily-*.dump 2>/dev/null | head -n 1 || true)"
            [ -n "$daily" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::The db-backup service did not write a dump."
              $compose logs db-backup || true
              exit 1
            fi
            sleep 2
          done
          [ -O "$daily" ] || { echo "::error::$daily is not owned by the backup directory's owner."; exit 1; }
          # The first daily dump can predate the backend's migrations, so only check that it is
          # a readable archive. (Listings are captured first: `| grep -q` can SIGPIPE pg_restore.)
          $compose exec -T db pg_restore --list < "$daily" > /dev/null
          echo "daily dump OK: $(basename "$daily")"
          # The same pre-deploy dump command the deploy workflow runs, taken after the migrations.
          $compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' > ../coms-backups/predeploy-ci.dump
          listing="$($compose exec -T db pg_restore --list < ../coms-backups/predeploy-ci.dump)"
          grep -q 'TABLE public members' <<< "$listing"
          echo "pre-deploy dump OK"

      # This database was created a minute ago and holds nothing, so its output can be shown.
      # The deploy workflow must not do the same with the production containers.
      - name: Show container state and output on failure
        if: failure()
        run: |
          docker compose --env-file .env -f docker-compose.yml ps || true
          docker logs --tail=300 coms-backend || true
          docker logs --tail=100 coms-frontend || true
          docker logs --tail=100 coms-lab-compiler || true

  backend-e2e:
    name: Real-backend auth e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Backend-auth e2e
        run: npm run test:e2e:backend

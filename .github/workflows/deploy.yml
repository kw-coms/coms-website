name: Deploy COMS Website

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Manual deploys must not bypass CI: resolve deploy_ref to a commit SHA and require a
  # successful CI workflow run for that exact SHA before anything reaches the server.
  verify-manual-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Require successful CI run for deploy_ref
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ github.event.inputs.deploy_ref }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_REF" --jq .sha)"
          echo "Resolved $DEPLOY_REF -> $SHA"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "Refusing manual deploy: no successful CI run found for $SHA (latest completed conclusion: $CONCLUSION)." >&2
            echo "Run the CI workflow for this ref and retry once it is green." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [verify-manual-ref]
    permissions: {}
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            needs.verify-manual-ref.result == 'success'
          ) ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.conclusion == 'success'
          )
        )
      }}
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to COMS server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/apps/coms-website' }}
          DEPLOY_REPO: https://github.com/kw-coms/coms-website.git
          # Manual deploys use the CI-verified SHA (not the raw ref) so the branch cannot
          # move between verification and deploy.
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && needs.verify-manual-ref.outputs.sha || github.event.workflow_run.head_sha }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://coms.kw.ac.kr' }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            echo "Missing deploy secrets. Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_SSH_KNOWN_HOSTS." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
          if [ "$DEPLOY_PORT" = "22" ]; then
            if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null && ! ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null; then
              echo "DEPLOY_SSH_KNOWN_HOSTS does not contain an expected key for $DEPLOY_HOST." >&2
              exit 1
            fi
          elif ! ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null; then
            echo "DEPLOY_SSH_KNOWN_HOSTS does not contain an expected key for [$DEPLOY_HOST]:$DEPLOY_PORT." >&2
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=${DEPLOY_PATH@Q} DEPLOY_REPO=${DEPLOY_REPO@Q} DEPLOY_REF=${DEPLOY_REF@Q} PUBLIC_BASE_URL=${PUBLIC_BASE_URL@Q} bash -c 'tmp=\$(mktemp /tmp/coms-deploy.XXXXXX); cat > \"\$tmp\"; bash \"\$tmp\"; status=\$?; rm -f \"\$tmp\"; exit \"\$status\"'" << 'REMOTE'
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
            PUBLIC_BASE_URL="${PUBLIC_BASE_URL%/}"

            # This repository and its Actions logs are public, and container output can carry
            # student numbers and client addresses. Keep it on the server and print only where
            # it went.
            save_container_logs() {
              log_dir="$HOME/deploy-logs"
              stamp="$(date +%Y%m%dT%H%M%S)"
              mkdir -p "$log_dir" || true
              chmod 700 "$log_dir" || true
              for container in "$@"; do
                ( umask 077; docker logs --tail=500 "$container" > "$log_dir/$stamp-$container.log" 2>&1 ) || true
              done
              # Saved output is only for the next few deploys' troubleshooting.
              find "$log_dir" -maxdepth 1 -type f -name '*.log' -mtime +30 -delete 2>/dev/null || true
              echo "Container output was saved on the server in ~/deploy-logs/$stamp-*.log and is not printed here." >&2
            }

            # Waits for the new release: first the backend on loopback, then the public site
            # through the host proxy. The prod backend may take up to its 120 s healthcheck
            # start_period (Flyway + schema validation), so the first loop allows ~3 minutes.
            site_is_healthy() {
              for attempt in $(seq 1 60); do
                if curl -fsS -o /dev/null http://127.0.0.1:8080/actuator/health; then
                  break
                fi
                if [ "$attempt" -eq 60 ]; then
                  return 1
                fi
                sleep 3
              done
              for attempt in $(seq 1 20); do
                if curl -fsI -o /dev/null "$PUBLIC_BASE_URL/" &&
                   curl -fsS -o /dev/null "$PUBLIC_BASE_URL/api/server/time" &&
                   health="$(curl -fsS "$PUBLIC_BASE_URL/actuator/health")" &&
                   grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <<< "$health"; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            if ! command -v git >/dev/null 2>&1; then
              echo "git is required on the server." >&2
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose is required on the server." >&2
              exit 1
            fi

            mkdir -p "$(dirname "$DEPLOY_PATH")"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone "$DEPLOY_REPO" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git remote set-url origin "$DEPLOY_REPO"
            git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
            if git rev-parse --verify --quiet "origin/$DEPLOY_REF^{commit}" >/dev/null; then
              git reset --hard "origin/$DEPLOY_REF"
            elif git rev-parse --verify --quiet "$DEPLOY_REF^{commit}" >/dev/null; then
              git reset --hard "$DEPLOY_REF"
            else
              git fetch origin "$DEPLOY_REF"
              git reset --hard FETCH_HEAD
            fi

            # Keep only persistent secrets/data; remove every other untracked or ignored build artifact.
            # secrets/ holds the optional Firebase service-account file mounted by docker-compose.yml.
            git clean -fdx -e .env -e backend-data/ -e backend/uploads/ -e uploads/ -e secrets/

            NEW_TAG="$(git rev-parse --short=12 HEAD)"
            export COMS_IMAGE_TAG="$NEW_TAG"

            if [ ! -f .env ]; then
              echo "Missing $DEPLOY_PATH/.env on the server. Create it from .env.example before deploying." >&2
              exit 1
            fi

            if $COMPOSE --env-file .env -f docker-compose.yml exec -T db true >/dev/null 2>&1; then
              V38_SCRIPT="$($COMPOSE --env-file .env -f docker-compose.yml exec -T db sh -c \
                'if [ "$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT to_regclass('\''public.flyway_schema_history'\'')")" = "flyway_schema_history" ]; then
                   psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT script FROM flyway_schema_history WHERE version = '\''38'\'' AND success = true ORDER BY installed_rank DESC LIMIT 1"
                 fi')"
              if [ -n "$V38_SCRIPT" ] && [ "$V38_SCRIPT" != "V38__mobile_push_tokens.sql" ]; then
                echo "Refusing deploy: Flyway V38 is recorded as $V38_SCRIPT, expected V38__mobile_push_tokens.sql." >&2
                echo "Back up the database and repair its Flyway history before deploying this release." >&2
                exit 1
              fi
            fi

            # Backups live outside the checkout (docker-compose.yml mounts the same directory
            # into the db-backup service). Creating it here, as the deploy user, keeps it
            # owner-only and readable without sudo.
            BACKUP_DIR="$(sed -n 's/^COMS_BACKUP_DIR=//p' .env | tail -n 1)"
            BACKUP_DIR="${BACKUP_DIR%\"}"
            BACKUP_DIR="${BACKUP_DIR#\"}"
            BACKUP_DIR="${BACKUP_DIR:-../coms-backups}"
            case "$BACKUP_DIR" in
              /*) ;;
              *) BACKUP_DIR="$DEPLOY_PATH/$BACKUP_DIR" ;;
            esac
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            # Dump the database before the new release can run its Flyway migrations, so a bad
            # migration can always be undone. No deploy goes ahead without this dump.
            if $COMPOSE --env-file .env -f docker-compose.yml exec -T db true >/dev/null 2>&1; then
              dump="$BACKUP_DIR/predeploy-$(date +%Y%m%dT%H%M%S)-$NEW_TAG.dump"
              if ( umask 077; $COMPOSE --env-file .env -f docker-compose.yml exec -T db \
                     sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' > "$dump.partial" ) &&
                 [ -s "$dump.partial" ]; then
                mv "$dump.partial" "$dump"
                echo "Database backed up before deploy: $(basename "$dump")"
              else
                rm -f "$dump.partial"
                echo "Refusing deploy: the pre-deploy database backup failed." >&2
                exit 1
              fi
              # Keep the ten most recent pre-deploy dumps.
              ls -1t "$BACKUP_DIR"/predeploy-*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f || true
            fi

            # Remember the images the site runs right now, so a release that fails its health
            # check can be replaced by them again.
            ROLLBACK_READY=0
            if docker inspect coms-backend >/dev/null 2>&1 && docker inspect coms-frontend >/dev/null 2>&1; then
              docker tag "$(docker inspect -f '{{.Image}}' coms-backend)" coms-backend:previous
              docker tag "$(docker inspect -f '{{.Image}}' coms-frontend)" coms-frontend:previous
              ROLLBACK_READY=1
            fi

            # CI already ran the full backend and frontend suites on this exact commit (this job
            # only starts after a green CI run), so the server only builds the images. Building
            # first keeps the current release serving until the new images exist.
            $COMPOSE --env-file .env -f docker-compose.yml build
            $COMPOSE --env-file .env -f docker-compose.yml up -d --remove-orphans

            if ! site_is_healthy; then
              $COMPOSE --env-file .env -f docker-compose.yml ps
              save_container_logs coms-backend coms-frontend
              if [ "$ROLLBACK_READY" = 1 ]; then
                echo "The new release failed its health check. Rolling back to the previous release." >&2
                docker tag coms-backend:previous coms-backend:latest
                docker tag coms-frontend:previous coms-frontend:latest
                COMS_IMAGE_TAG=previous $COMPOSE --env-file .env -f docker-compose.yml up -d --no-build coms-backend coms-frontend
                if site_is_healthy; then
                  echo "Rollback finished: the site is running the previous release again." >&2
                else
                  $COMPOSE --env-file .env -f docker-compose.yml ps
                  save_container_logs coms-backend coms-frontend
                  echo "Rollback did not bring the site back. Restore by hand: docs/operations/backup-and-rollback.md" >&2
                fi
              fi
              exit 1
            fi

            # The release is live. `latest` follows it so a manual `docker compose up -d` on the
            # server keeps running it, and only the live and previous release images are kept.
            docker tag "coms-backend:$NEW_TAG" coms-backend:latest
            docker tag "coms-frontend:$NEW_TAG" coms-frontend:latest
            for repo in coms-backend coms-frontend; do
              docker image ls "$repo" --format '{{.Tag}}' | while read -r tag; do
                case "$tag" in
                  "$NEW_TAG"|previous|latest|"<none>") ;;
                  *) docker rmi "$repo:$tag" >/dev/null 2>&1 || true ;;
                esac
              done
            done
            # Images named after the compose project (the names used before this file set its own)
            # are no longer referenced by anything.
            docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E -- '-coms-(backend|frontend):latest$' | xargs -r docker rmi >/dev/null 2>&1 || true
            docker image prune -f
          REMOTE

name: Dependency Check

# OWASP Dependency-Check — scans backend Gradle dependencies for known CVEs.
#
# This workflow is intentionally NOT triggered on push/PR: the NVD database
# download is slow, and a finding (or a transient feed failure)
# should never block day-to-day development. It runs on a weekly schedule and
# can be kicked off manually from the Actions tab.
#
# Uses the Dependency-Check-maintained NVD feed by default. An NVD_API_KEY
# repository secret opts in to the direct NVD API.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 09:00 UTC.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Gradle toolchain pins Java 21 (Spring Boot 4 / Gradle 9.x); 17 will not compile.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run OWASP Dependency-Check
        id: depcheck
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            backend/build/reports/dependency-check/dependency-check-report.html
            backend/build/reports/dependency-check/dependency-check-report.json
          if-no-files-found: error

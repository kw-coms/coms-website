services:
  compiler:
    build:
      context: .
    image: coms-circuit-lab-compiler:local
    init: true
    restart: unless-stopped
    network_mode: none
    user: "10001:${NGINX_GID:?Set NGINX_GID to the host nginx group ID}"
    volumes:
      - /run/coms-lab:/run/coms-lab
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 25s
    environment:
      LISTEN_SOCKET: /run/coms-lab/compile.sock
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-10}"
      TRUST_PROXY: "1"
      AUTH_CHECK_URL: ""
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

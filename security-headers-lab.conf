# Circuit Lab (/lab/, built from lab/) has a narrower CSP than the SPA: it loads nothing from other
# origins. Why each looser-than-default entry exists (lab/docs/DEPLOY.md):
#   - style-src 'unsafe-inline' -> CodeMirror injects <style> elements
#   - img-src data:             -> the inline favicon in lab/index.html
#   - img-src/worker-src blob:  -> three.js textures and the simulator worker
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
include /etc/nginx/security-headers-common.conf;

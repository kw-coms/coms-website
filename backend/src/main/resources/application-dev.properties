# Dev profile — activate with: --spring.profiles.active=dev
# or set SPRING_PROFILES_ACTIVE=dev

spring.h2.console.enabled=true
cookie.secure=false
# Supply JWT_SECRET for each local dev session; never sign tokens with a published key.

# JPA manages schema in dev (Flyway is for prod only)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

cors.allowed-origins=http://localhost:3000,http://localhost:5173

spring.application.name=backend

# H2 File-based Database
spring.datasource.url=jdbc:h2:file:./data/comsdb;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Off on purpose. With open-in-view (Spring Boot's default) a request keeps its database
# connection from its first query until the last byte of the response is written. For a file,
# image or video response that is the whole download: ten viewers on slow connections — or one
# client that opens ten downloads and stops reading — held every connection in the pool, and
# every other API call then waited on the pool and failed. Services open their own transactions,
# so nothing needs the connection once the controller has its result.
spring.jpa.open-in-view=false

# Flyway -- production profile enables migrations
spring.flyway.enabled=false

# H2 Console — disabled by default; set H2_CONSOLE_ENABLED=true only in dev
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JWT — required; no default. Set JWT_SECRET env var (min 32 chars)
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

# Cookie — secure by default (requires HTTPS); dev profile overrides.
# SameSite=None is required when issuing cookies to cross-origin clients
# (e.g. the Capacitor APK at https://localhost calling coms.kw.ac.kr).
# For the Capacitor mobile app set COOKIE_SAME_SITE=None and COOKIE_SECURE=true in .env.
# SameSite=None mandates Secure=true (HTTPS); never use None on plain HTTP.
# CORS: also add https://localhost and capacitor://localhost to CORS_ALLOWED_ORIGINS.
# Default remains Lax so local browser dev is unaffected.
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Scheduled jobs. Spring's scheduler has one thread by default, so a slow job holds up all the
# others: the app catalogue's link check can take minutes when apps do not answer, and the
# nightly retention jobs would wait behind it. Two threads keep them apart.
spring.task.scheduling.pool.size=2

# CORS — required in non-dev profiles. application-dev.properties supplies localhost.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.public-base-url=${PUBLIC_BASE_URL:}

# Ceiling for a request body that is not a multipart upload (uploads keep the multipart limits
# below). The largest legitimate one is a mini-app document: 1,000,000 characters, about 4 MB
# of UTF-8 in the worst case with its envelope. Anything larger is answered with 413 before it
# is parsed (RequestBodyLimitFilter).
app.max-request-body-bytes=${MAX_REQUEST_BODY_BYTES:8388608}

# Local archive storage
storage.location=./uploads
# Sized to the largest legitimate per-endpoint cap (club project distributables, 200MB).
# The request cap adds headroom for multipart framing and accompanying form fields.
# Parse a multipart body only when a handler actually takes the parts. Parsed eagerly, any
# multipart request that got past the security rules was spooled to disk in full before the
# handler ran — also on the anonymous JSON endpoints (login, signup, recruit), which never
# read a part: 210 MB per request, for anyone.
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Email verification. Set MAIL_ENABLED=true and SMTP_* env vars in production.
mail.enabled=${MAIL_ENABLED:false}
mail.log-verification-codes=${MAIL_LOG_VERIFICATION_CODES:false}
mail.from=${MAIL_FROM:no-reply@coms.kw.ac.kr}
recruit.mail.to=${RECRUIT_MAIL_TO:kwcoms69@gmail.com}
youtube.api-key=${YOUTUBE_API_KEY:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# Jakarta Mail waits forever by default. Verification, password-reset and recruit mails are sent
# on request threads, so one stalled SMTP server would pin those threads (and the database
# connections they hold) until the whole API stopped answering.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}

# Server-to-server integration HMAC. Set INTEGRATION_HMAC_SECRET (>=32 chars).
integration.hmac-secret=${INTEGRATION_HMAC_SECRET:}

# Mobile push (FCM). Disabled by default — a no-op until BOTH push.enabled=true AND a
# readable Firebase service-account JSON exists at push.firebase.credentials-path.
push.enabled=${PUSH_ENABLED:false}
push.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Sentry error reporting. Blank DSN = disabled (Sentry's default no-op behavior).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENV:production}
sentry.traces-sample-rate=0.1

# Keep framework error bodies message-free: the frontend surfaces `message` from 401/403
# responses as user-facing copy (src/services/apiClient.ts), so servlet sendError() strings
# (e.g. "Untrusted request origin.") must never be promoted into it.
server.error.include-message=never

# Response compression. /assets/* is gzipped by nginx, but every /api/* response went out
# uncompressed — a JSON list is 4-5x its gzipped size on the wire.
# The mime-type list is deliberate: only text-shaped payloads. Uploaded images, video and
# octet-stream downloads are already compressed, so re-compressing them would burn CPU for
# nothing and break nothing but the byte count.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,application/javascript,text/html,text/css,text/plain,text/javascript
server.compression.min-response-size=1024

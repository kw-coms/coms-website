spring.datasource.url=jdbc:h2:mem:coms-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# Club forms use JDBC. Apply their idempotent DDL after Hibernate creates the H2 parent tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V120__club_forms.sql,classpath:db/migration/V121__external_opportunities.sql,classpath:db/init/attendance_code_lock.sql
cors.allowed-origins=http://localhost:5173

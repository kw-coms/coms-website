plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.owasp.dependencycheck' version '10.0.4'
}

group = 'com.coms'
version = '0.0.1-SNAPSHOT'

// OWASP Dependency-Check — scans declared dependencies for known CVEs.
// Run on demand / on a schedule via `./gradlew dependencyCheckAnalyze`; it is
// intentionally NOT wired into the normal build, since the NVD database download
// is slow and rate-limited. Set the NVD_API_KEY env var (free key from
// https://nvd.nist.gov/developers/request-an-api-key) to avoid rate limits.
dependencyCheck {
	failBuildOnCVSS = 7.0
	formats = ['HTML', 'JSON']
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.apache.poi:poi-ooxml:5.4.0'
	implementation 'org.apache.commons:commons-csv:1.11.0'

	// jsoup — lenient HTML parser used to extract OpenGraph/meta tags for link-preview
	// cards. We fetch the remote HTML ourselves (with strict SSRF guards) and only hand
	// the already-downloaded bytes to jsoup for parsing; jsoup never performs network I/O.
	implementation 'org.jsoup:jsoup:1.18.1'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// H2 Database (file-based, no external DB needed)
	runtimeOnly 'com.h2database:h2'

	// PostgreSQL driver (prod)
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway for schema migrations
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-flyway'

	// OpenAPI / Swagger UI — springdoc 2.x targets Boot 3; Boot 4 compatibility unconfirmed
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

	// Firebase Admin SDK — used by PushNotificationSender to send FCM push.
	// Fully gated behind push.enabled + a valid credentials file; a no-op otherwise.
	implementation 'com.google.firebase:firebase-admin:9.4.1'

	// Sentry error reporting — env-gated. Blank SENTRY_DSN = clean no-op (Sentry default).
	// NOTE: the sentry-spring-boot-starter-jakarta auto-configuration targets Spring Boot 3
	// and references org.springframework.boot.web.client.RestClientCustomizer, which was
	// removed in Boot 4 — pulling in the starter breaks every ApplicationContext load.
	// We therefore use the plain Spring (non-Boot) integration + explicit @EnableSentry,
	// which is Boot-version-agnostic and still a clean no-op when the DSN is blank.
	implementation 'io.sentry:sentry-spring-jakarta:7.18.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active',
			System.getProperty('spring.profiles.active')
					?: System.getenv('SPRING_PROFILES_ACTIVE')
					?: 'test'
}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-comsdb}
      POSTGRES_USER: ${DB_USER:-coms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  coms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coms-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-comsdb}
      DB_USER: ${DB_USER:-coms}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_LOG_VERIFICATION_CODES: ${MAIL_LOG_VERIFICATION_CODES:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@coms.kw.ac.kr}
      RECRUIT_MAIL_TO: ${RECRUIT_MAIL_TO:-kwcoms69@gmail.com}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://coms.kw.ac.kr,http://coms.kw.ac.kr,http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://coms.kw.ac.kr}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend-data:/app/data
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  coms-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coms-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - coms-backend

volumes:
  pgdata:
  backend-uploads:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-comsdb}
      POSTGRES_USER: ${DB_USER:-coms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  coms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coms-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-comsdb}
      DB_USER: ${DB_USER:-coms}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_LOG_VERIFICATION_CODES: ${MAIL_LOG_VERIFICATION_CODES:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@coms.kw.ac.kr}
      RECRUIT_MAIL_TO: ${RECRUIT_MAIL_TO:-kwcoms69@gmail.com}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://coms.kw.ac.kr,http://coms.kw.ac.kr,http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://coms.kw.ac.kr}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      # Sentry error reporting — blank DSN = disabled (safe no-op).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      # Mobile push (FCM) — disabled until PUSH_ENABLED=true AND a creds file is mounted+set.
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend-data:/app/data
      - backend-uploads:/app/uploads
      # To enable FCM push, mount the Firebase service-account JSON read-only and set
      # FIREBASE_CREDENTIALS_PATH (+ PUSH_ENABLED=true) in your .env, e.g.:
      #   FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
      # - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy

  coms-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENV: ${VITE_SENTRY_ENV:-production}
        # Sentry source map upload (optional). Empty token = no upload, normal build.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    container_name: coms-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      # nginx:1.27-alpine has BusyBox wget but no curl. Use 127.0.0.1, not
      # localhost: in-container "localhost" resolution is unreliable (observed
      # connection-refused on the prod host — ::1 vs the IPv4-only `listen 80`,
      # plus the host DNS search domain returning NXDOMAIN), which kept this
      # healthcheck permanently failing while the site itself was healthy.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - coms-backend

volumes:
  pgdata:
  backend-uploads:

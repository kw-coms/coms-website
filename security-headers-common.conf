# Security headers every document context shares, whatever its CSP: security-headers.conf (the SPA)
# and security-headers-lab.conf (Circuit Lab) each add their own Content-Security-Policy and include
# this file. nginx add_header does not inherit into a location that declares its own add_header,
# so each location includes one of those two files instead of repeating this list.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

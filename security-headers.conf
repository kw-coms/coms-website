# Security headers for the SPA HTML/document context.
# nginx add_header does NOT inherit into locations that declare their own
# add_header, so this snippet is `include`d in each such location.
#
# CSP mirrors the backend policy (SecurityConfig.java) but widens the
# directives the *frontend* legitimately needs at runtime:
#   - style-src/font-src cdn.jsdelivr.net  -> Pretendard webfont (fontPreferences.ts)
#   - img-src https:                       -> external post images, link-preview og:images, emoji
#   - connect-src *.sentry.io              -> Sentry browser SDK ingest (only when VITE_SENTRY_DSN set)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

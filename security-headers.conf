# Security headers for the SPA HTML/document context.
# nginx add_header does NOT inherit into locations that declare their own
# add_header, so this snippet is `include`d in each such location.
#
# CSP mirrors the backend policy (SecurityConfig.java) but widens the
# directives the *frontend* legitimately needs at runtime:
#   - style-src cdn.jsdelivr.net + fonts.googleapis.com -> webfont stylesheets (fontPreferences.ts: Pretendard + Google Fonts picker)
#   - font-src  cdn.jsdelivr.net + fonts.gstatic.com     -> the woff2 files those stylesheets pull
#   - img-src https:                       -> external post images, link-preview og:images, emoji
#   - connect-src *.sentry.io              -> Sentry browser SDK ingest (only when VITE_SENTRY_DSN set)
#   - frame-src  youtube                   -> community externalEmbed YouTube players (youtubeEmbedUrl -> www.youtube.com/embed; reader + editor preview)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.sentry.io; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

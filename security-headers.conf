# Security headers for the SPA HTML/document context.
# nginx add_header does NOT inherit into locations that declare their own
# add_header, so this snippet is `include`d in each such location.
#
# CSP mirrors the backend policy (SecurityConfig.java) but widens the
# directives the *frontend* legitimately needs at runtime:
#   - style-src cdn.jsdelivr.net + fonts.googleapis.com -> webfont stylesheets (fontPreferences.ts: Pretendard + Google Fonts picker)
#   - font-src  cdn.jsdelivr.net + fonts.gstatic.com     -> the woff2 files those stylesheets pull
#   - img-src https:                       -> external post images, link-preview og:images, emoji
#   - media-src blob: + https:             -> <video> in post bodies: blob: is the local preview the
#                                             editor creates before upload (TiptapMediaBlockView /
#                                             PostBlocks), https: the stored file afterwards. Both the
#                                             sanitizer allow-list AND this CSP must permit a media
#                                             source or the preview renders as a dead player.
#   - connect-src *.sentry.io              -> Sentry browser SDK ingest (only when VITE_SENTRY_DSN set)
#   - frame-src  'self' + youtube          -> community externalEmbed YouTube players (youtubeEmbedUrl -> www.youtube.com/embed; reader + editor preview);
#                                             'self' is the /study demo sandbox frame (/study-sandbox.html, own sandboxed CSP in nginx.frontend.conf)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.sentry.io; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
include /etc/nginx/security-headers-common.conf;
